</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要內容</a>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="文明 VI 戰略百科首頁">
      <span class="brand-mark" aria-hidden="true"><img src="assets/civ6-app-icon.png" width="38" height="38" alt=""></span>
      <span><strong>文明 VI</strong><small>攻略 × Wiki 戰略百科</small></span>
    </a>
    <nav class="primary-nav" aria-label="主要導覽">
      <a href="#/guide" data-nav="guide">攻略</a>
      <a href="#/wiki" data-nav="wiki">Wiki</a>
      <a href="#/favorites" data-nav="favorites">收藏</a>
    </nav>
    <div class="top-actions">
      <button class="icon-button search-trigger" type="button" aria-label="開啟全站搜尋" title="全站搜尋（/）">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span class="search-trigger-label">全站搜尋</span>
      </button>
      <button class="icon-button" id="theme-cycle" type="button" aria-label="切換顯示主題" title="切換顯示主題">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"></path></svg>
      </button>
      <button class="icon-button" id="settings-open" type="button" aria-label="開啟資料管理" title="資料管理">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.13.37.34.72.6 1 .3.28.68.42 1.1.4h.09v4h-.09A1.7 1.7 0 0 0 19.4 15Z"></path></svg>

  <div class="storage-warning" id="storage-warning" role="status" hidden>瀏覽器目前無法保存本機資料，閱讀功能仍可正常使用。</div>
  <main id="main-content" tabindex="-1"></main>
  <nav class="mobile-nav" aria-label="行動版主要導覽">
    <a href="#/guide" data-nav="guide">攻略</a>
    <a href="#/wiki" data-nav="wiki">Wiki</a>
    <a href="#/favorites" data-nav="favorites">收藏</a>
  </nav>

  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <form method="dialog" class="dialog-top"><h2 id="search-title">全站搜尋</h2><button class="icon-button" aria-label="關閉搜尋">×</button></form>
    <div class="search-scope" role="group" aria-label="搜尋範圍">
      <button class="active" type="button" data-search-scope="all" aria-pressed="true">全部</button>
      <button type="button" data-search-scope="guide" aria-pressed="false">攻略</button>
      <button type="button" data-search-scope="wiki" aria-pressed="false">Wiki</button>
    </div>
    <label class="field-label" for="global-search">搜尋攻略、領袖、文明、地形、資源、區域、建築、政策卡或模式</label>
    <input id="global-search" class="search-input" type="search" autocomplete="off" placeholder="例如：秦始皇、科學勝利、沼澤、鋁、學院">
    <div id="search-results" class="search-results" role="listbox" aria-label="搜尋建議"></div>
  </dialog>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog" class="dialog-top"><h2 id="settings-title">顯示與資料</h2><button class="icon-button" aria-label="關閉資料管理">×</button></form>
    <section><h3>顯示主題</h3><div class="segmented" role="group" aria-label="顯示主題"><button type="button" data-theme-choice="system">跟隨系統</button><button type="button" data-theme-choice="light">淺色</button><button type="button" data-theme-choice="dark">深色</button></div></section>
    <section><h3>備份閱讀資料</h3><p>收藏、閱讀進度、主題及篩選條件都只保存在此瀏覽器。</p><div class="button-row"><button class="button secondary" id="export-data" type="button">匯出 JSON</button><label class="button secondary file-button">匯入 JSON<input id="import-data" type="file" accept="application/json,.json"></label></div></section>
    <section><h3>內容版本</h3><p>目前為 <strong>2026.08</strong>，以 Gathering Storm、標準速度與標準地圖為基準；攻略、Wiki、模式與互動工具均隨離線資料包提供。</p></section>
    <section class="danger-zone"><h3>重設資料</h3><p>清除後無法復原，建議先匯出備份。</p><button class="button danger" id="clear-data" type="button">清除全部本機資料</button></section>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="assets/data.bundle.js?v=20260825-visual-system-1"></script>
  <script src="assets/app.js?v=20260825-visual-system-1"></script>

</html>
